name: SkillPlay India APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare Gradle wrapper
        run: chmod +x ./gradlew

      - name: Remove Termux-only AAPT2 path in CI
        run: sed -i '/^android\.aapt2FromMavenOverride=/d' gradle.properties

      - name: Skip Google Services plugin when its config is absent
        run: |
          if [ ! -f app/google-services.json ]; then
            sed -i '/alias(libs.plugins.google.services)/d' app/build.gradle.kts
            sed -i '/googleServices { missingGoogleServicesStrategy = MissingGoogleServicesStrategy.WARN }/d' app/build.gradle.kts
          fi

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: skillplay-india-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
